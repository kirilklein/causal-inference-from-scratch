  <title id="curriculum-title">The course at a glance</title>
  <desc id="curriculum-desc">The core route moves from causal questions through comparisons, causal roles, and models to conducting an analysis. Optional advanced topics branch from causal roles and models with topic-specific prerequisites. Phase one and the first chapter of phase two are available here; the remaining companion chapters are planned.</desc>
